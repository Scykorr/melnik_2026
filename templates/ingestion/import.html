{% extends "base.html" %}
{% block content %}
<section class="card" style="max-width: 720px">
  <h1>Импорт JSON или CSV</h1>
  <p class="muted">Колонки: url, title, text, published_at, language. Это не обход сайта, а загрузка уже полученного файла.</p>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Импортировать</button></form>
</section>
{% endblock %}
